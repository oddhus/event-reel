[project]
name = "event-reel"
version = "0.1.1"
description = "Home Assistant integration: AI descriptions of camera events for the Event Reel card"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.event_reel"]
force-sort-within-sections = true
combine-as-imports = true
