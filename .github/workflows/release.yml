name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the manifest version
        run: |
          test "v$(jq -r .version custom_components/event_reel/manifest.json)" = "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
